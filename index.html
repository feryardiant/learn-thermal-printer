<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Termal Print</title>
    <!-- receiptline browser build, served at /receiptline.js by a Vite plugin
         (from node_modules in dev; emitted to dist on build). Exposes window.receiptline
         for ESC/POS generation in the browser. -->
    <script crossorigin src="/receiptline.js"></script>
  </head>
  <body>
    <div id="app">
      <section id="center">
        <div>
          <h1>Thermal Print</h1>
          <p>Print text to a Bluetooth ESC/POS printer.</p>
        </div>

        <div class="row">
          <button id="check-btn" type="button" class="btn">Check printer</button>
          <span id="device-status" class="status">No device</span>
        </div>

        <textarea id="text-input" rows="4" placeholder="Text to print..."></textarea>

        <div class="row">
          <button id="print-btn" type="button" class="btn" disabled>Print</button>
          <label class="opt">
            <input id="no-cut" type="checkbox" /> No cut
          </label>
        </div>

        <section id="samples" aria-label="Sample templates">
          <h2>Samples</h2>
          <p class="samples-hint">Pick a template to load it into the editor, then customize and print.</p>
          <div id="sample-grid" class="sample-grid"></div>
        </section>

        <pre id="log"></pre>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
